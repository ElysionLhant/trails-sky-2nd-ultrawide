; ============================================================================
;  Trails in the Sky 2nd Chapter (Sora no Kiseki the 2nd) — 32:9 / ultrawide fix
;  Runtime byte-patches, applied by SUWSF at game launch (no files modified).
;
;  Loader: the game does NOT import dsound.dll. It imports d3d11.dll
;  (D3D11CreateDevice), so rename the bundled UAL binary to "d3d11.dll".
;  See README for full install instructions.
;
;  Tested on: Steam buildid 25340742 (2026-09-17), sora_2nd.exe (13,463,552 bytes).
;  Static / offline alternative: apply_32x9_patch.py (same 4 writes).
; ============================================================================

[UserSettings]
; Screen resolution used for %variables% (width / height / aspectratio)
; in Value expressions. Not used by the patches below.
; "auto" (default) or explicit, e.g. "5120x1440".
Resolution="auto"
; Global switch for all patches.
Enabled=true

; ----------------------------------------------------------------------------
; 1/4 — Unclamp rendering width
; The original code clamps the rendered width back to the maximum supported
; aspect ratio, which causes pillarboxing on 32:9. The clamp runs only when
; the current aspect exceeds the max:  comiss xmm6, xmm0 ; jbe skip
; Patch: change that conditional JBE into an unconditional JMP so the clamp
; is always skipped.  jbe +0x1A (76 1A) -> jmp +0x1A (EB 1A)
[Patch:UW_ResWidthUnclamp]
Enabled=true
Pattern="0F 57 F6 F3 48 0F 2A F7 F3 48 0F 2A CE F3 0F 5E F1 0F 2F F0 76 1A"
Offset=20
Value="EB"
ValueType="byte"
Match=1

; ----------------------------------------------------------------------------
; 2/4 — Unclamp rendering height
; Same clamp logic for the height.  jbe +0x24 (76 24) -> jmp +0x24 (EB 24)
[Patch:UW_ResHeightUnclamp]
Enabled=true
Pattern="F3 0F 10 8B BC 00 00 00 0F 2F CE 0F 28 74 24 20 76 24"
Offset=16
Value="EB"
ValueType="byte"
Match=1

; ----------------------------------------------------------------------------
; 3/4 + 4/4 — Remove cutscene letterbox bars (top and bottom)
; The bar size is loaded from a render-size field; force it to 0:
;   mov ecx,[rax+0xB0]  ->  xor ecx,ecx ; nop x4   (6 bytes -> 6 bytes)
; The identical code exists twice (top bar + bottom bar), hence Match=all.
[Patch:UW_LetterboxBars]
Enabled=true
Pattern="8B 83 80 00 00 00 0F 57 D2 0F 11 44 24 20 8B 88 B0 00 00 00"
Offset=14
Value="31 C9 90 90 90 90"
ValueType="byte"
Match="all"
